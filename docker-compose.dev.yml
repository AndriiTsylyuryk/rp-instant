volumes:
  pb_data:
    name: rp-instant_pb_data

services:
  pocketbase:
    build:
      context: ./pocketbase
      args:
        PB_VERSION: "${PB_VERSION}"
    restart: unless-stopped
    ports: ["127.0.0.1:8090:8090"]
    volumes:
      - pb_data:/pb_data
      - ./pocketbase/pb_migrations:/pb_migrations
